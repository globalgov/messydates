url: https://globalgov.github.io/messydates/
development:
    mode: auto
template:
  bootstrap: 5
  params:
    bootswatch: journal
authors:
  James Hollway:
    href: https://jameshollway.com
navbar:
  structure:
    left:
    - home
    - intro
    - reference
    - articles
    - news
    right:
    - search
    - github
  components:
    home:
      icon: fa-home fa-lg
      href: index.html
      aria-label: Take me home
    reference:
      text: Reference
      href: reference/index.html
    news:
      text: News
      href: news/index.html
    github:
      icon: "fab fa-github fa-lg"
      href: https://github.com/globalgov/messydates
      aria-label: Take me to the Github repository
reference:
  - title: "Class construction"
    desc: "These functions construct dates in the `mdate` class and durations in the `mduration` class:"
    contents:
      - starts_with("class_")
  - title: "Coerce to"
    desc: "These functions coerce dates from other classes to the `mdate` class:"
    contents:
      - coerce_to
      - md_problems
  - title: "Coerce from"
    desc: "These functions coerce dates from the `mdate` class into a single `Date`:"
    contents:
      - starts_with("as\\.")
      - starts_with("resolve_")
  - title: "Manipulation"
    desc: "These functions expand or contract objects of `mdate` class from/into a list:"
    contents:
      - starts_with("convert_")
  - title: "Components"
    desc: "These functions annotate or extract components of dates and times:"
    contents:
      - starts_with("component_")
  - title: "Operations"
    desc: "These methods help operate on objects of the `mdate` class:"
    contents:
      - starts_with("operate_")
  - title: "Data"
    desc: "Working with 'messy' data:"
    contents:
      - battles
