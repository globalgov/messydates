url: https://globalgov.github.io/messydates/
development:
    mode: auto
template:
  bootstrap: 5
  params:
    bootswatch: journal
authors:
  James Hollway:
    href: https://jameshollway.com
navbar:
  structure:
    left:
    - home
    - intro
    - reference
    - articles
    - news
    right:
    - search
    - github
  components:
    home:
      icon: fa-home fa-lg
      href: index.html
      aria-label: Take me home
    reference:
      text: Reference
      href: reference/index.html
    news:
      text: News
      href: news/index.html
    github:
      icon: "fab fa-github fa-lg"
      href: https://github.com/globalgov/messydates
      aria-label: Take me to the Github repository
reference:
  - title: "Retain"
    desc: "Read imprecise dates into the `mdate` class, and keep their imprecision."
  - subtitle: "Make"
    desc: "These functions make messy dates from text, numbers, and other date classes:"
    contents:
      - coerce_to
  - subtitle: "Check"
    desc: "This function reports which values could not be read, and why:"
    contents:
      - parse_problems
  - subtitle: "Mark"
    desc: "These functions add or remove ISO 8601-2 notation, such as approximate, uncertain, unspecified, or open:"
    contents:
      - parse_tag
  - title: "Reason"
    desc: "Work with the compatible set of each date, without resolving it."
  - subtitle: "Ask"
    desc: "These predicates give `TRUE` or `FALSE` for each date (`date_is_*()`):"
    contents:
      - operate_statements
  - subtitle: "Measure"
    desc: "These functions and operators give a number for each date (`date_by_*()`):"
    contents:
      - operate_within
      - operate_proportional
  - subtitle: "Compare and combine"
    desc: "These operators compare, combine, and shift messy dates:"
    contents:
      - operate_inequalities
      - operate_set
      - operate_arithmetic
      - convert_sequence
  - subtitle: "Describe"
    desc: "These functions list, extract, and draw what a messy date can be:"
    contents:
      - convert_expand
      - component_extract
      - plot_mdate
  - title: "Resolve"
    desc: "Choose one date from each compatible set, by a rule that you state."
  - subtitle: "Resolve"
    desc: "These functions resolve messy dates to their extremes, central tendency, or a random draw:"
    contents:
      - resolve_extrema
      - resolve_tendency
      - resolve_probabilistically
  - subtitle: "Convert"
    desc: "These methods convert messy dates to `Date`, `POSIXct`, and `POSIXlt`, with a resolution rule:"
    contents:
      - coerce_from
  - title: "Class and data"
    desc: "The `mdate` and `mduration` classes, and example data."
  - subtitle: "Classes"
    contents:
      - starts_with("class_")
  - subtitle: "Data"
    contents:
      - battles
